<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Planejamento — Momento Futuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div>
  <dc-import name="Planning" tab="futuro" dark="{{dark}}" hint-size="100%,1500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? false };
  }
}
</script>
</body>
</html>
